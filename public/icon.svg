<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="squircleClip">
      <rect x="16" y="16" width="480" height="480" rx="112"/>
    </clipPath>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="35%" stop-color="#2563eb"/>
      <stop offset="75%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="15%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="curtainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <filter id="laserGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#squircleClip)">
    <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
    <ellipse cx="180" cy="80" rx="220" ry="140" fill="#60a5fa" opacity="0.2"/>
    <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#rim)" stroke-width="3"/>

    <g filter="url(#cardShadow)">
      <rect x="124" y="94" width="264" height="324" rx="26" fill="url(#cardGrad)"/>
      <path d="M 332 94 L 388 150 L 350 150 A 18 18 0 0 1 332 132 Z" fill="#cbd5e1"/>
      <path d="M 332 94 L 388 150" stroke="#94a3b8" stroke-width="1.5" opacity="0.5"/>
    </g>

    <g fill="url(#symbolGrad)" transform="translate(162, 310) scale(0.063, -0.063)">
      <path d="M0 0L500 1490L1060 1490L1565 0L1097 0L1026 245L528 245L455 0ZM624 565L934 565L930 578Q891 713 854 845Q817 977 781 1113Q744 977 706 845Q668 713 628 578Z"/>
      <path transform="translate(1565, 0)" d="M80 0L80 1490L496 1490L496 859Q544 921 592 983Q640 1045 688 1107L984 1490L1465 1490L945 850L1493 0L1017 0L677 568L496 346L496 0Z"/>
    </g>

    <rect x="170" y="348" width="172" height="8" rx="4" fill="#94a3b8" opacity="0.4"/>
    <rect x="170" y="368" width="112" height="8" rx="4" fill="#94a3b8" opacity="0.25"/>

    <polygon points="84,264 428,264 402,330 110,330" fill="url(#curtainGrad)"/>
    <rect x="80" y="261" width="352" height="6" rx="3" fill="url(#laserGrad)" filter="url(#laserGlow)"/>

    <g fill="none" stroke="url(#bracketGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 94 160 L 94 116 A 18 18 0 0 1 112 98 L 156 98"/>
      <path d="M 356 98 L 400 98 A 18 18 0 0 1 418 116 L 418 160"/>
      <path d="M 94 352 L 94 396 A 18 18 0 0 0 112 414 L 156 414"/>
      <path d="M 356 414 L 400 414 A 18 18 0 0 0 418 396 L 418 352"/>
    </g>
  </g>
</svg>